line-length = 110
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "ANN",  # annotations
    "RUF",
]
ignore = [
    "ANN401",  # Any is occasionally the honest type for untyped third-party objects
    "B008",    # FastAPI's Depends/File defaults are the documented pattern
]

[lint.per-file-ignores]
"scripts/*" = ["ANN", "T201"]
